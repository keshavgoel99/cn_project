<rect width='1100' height='600' fill='white'/>
<text x='35' y='35' style='font-size:24px;font-weight:bold'>Metro MAN</text>
<line x1='550' y1='110' x2='410' y2='160' class=''/>
<line x1='410' y1='202' x2='275.0' y2='345' class=''/>
<line x1='410' y1='202' x2='825.0' y2='345' class=''/>
<line x1='550' y1='110' x2='690' y2='160' class='secondary'/>
<line x1='690' y1='202' x2='275.0' y2='345' class='secondary'/>
<line x1='690' y1='202' x2='825.0' y2='345' class='secondary'/>
<line x1='275.0' y1='387' x2='275.0' y2='425' class=''/>
