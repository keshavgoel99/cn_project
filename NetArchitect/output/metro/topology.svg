<svg xmlns='http://www.w3.org/2000/svg' width='1100' height='600' viewBox='0 0 1100 600' role='img' aria-labelledby='title desc'>
<title id='title'>Metro MAN topology</title>
<desc id='desc'>Hub and spoke logical topology with per-site distribution and access switches. Dashed paths are secondary links.</desc>
