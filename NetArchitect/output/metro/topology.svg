<text x='550' y='94.0' text-anchor='middle' class=''>HQ-DS</text>
<text x='550' y='56' text-anchor='middle' class='small'>7 access switches at hub</text>
<rect x='310.0' y='160' width='200' height='42' rx='5' class='edge'/>
