! NetArchitect generated lab configuration
enable
configure terminal
hostname Remote1-Finance-AS2
no ip domain-lookup
!
spanning-tree mode rapid-pvst
vlan 10
 name Finance
vlan 999
 name UNUSED-NATIVE
!
interface range GigabitEthernet1/0/1 - 40
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range GigabitEthernet1/0/41 - 48
 shutdown
!
interface TenGigabitEthernet1/1/1
 description TO-Remote1-DS
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,999
 switchport nonegotiate
 no shutdown
!
end
! Save after checking: copy running-config startup-config
