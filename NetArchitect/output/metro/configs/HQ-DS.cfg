! NetArchitect generated lab configuration
enable
configure terminal
hostname HQ-DS
no ip domain-lookup
!
ip routing
spanning-tree mode rapid-pvst
vlan 999
 name UNUSED-NATIVE
!
vlan 10
 name Finance
!
ip access-list extended VLAN-10-IN
 permit ip 10.20.0.0 0.0.0.255 any
 deny ip any any log
!
spanning-tree vlan 10 priority 4096
interface Vlan10
 ip address 10.20.0.1 255.255.255.0
 ip access-group VLAN-10-IN in
 ip ospf 1 area 0
 no shutdown
!
interface TenGigabitEthernet1/0/1
 description TO-HQ-Finance-AS1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,999
 switchport nonegotiate
 no shutdown
!
interface TenGigabitEthernet1/0/2
 description TO-HQ-Finance-AS2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,999
 switchport nonegotiate
 no shutdown
!
interface TenGigabitEthernet1/0/3
 description TO-HQ-Finance-AS3
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,999
 switchport nonegotiate
 no shutdown
!
interface TenGigabitEthernet1/0/4
 description TO-HQ-Finance-AS4
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,999
 switchport nonegotiate
 no shutdown
!
interface TenGigabitEthernet1/0/5
 description TO-HQ-Finance-AS5
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,999
 switchport nonegotiate
 no shutdown
!
interface TenGigabitEthernet1/0/6
 description TO-HQ-Finance-AS6
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,999
 switchport nonegotiate
 no shutdown
!
vlan 20
 name Guest
!
ip access-list extended VLAN-20-IN
 permit icmp 10.20.1.0 0.0.0.63 host 10.20.1.1 echo
 deny ip 10.20.1.0 0.0.0.63 10.0.0.0 0.255.255.255
 deny ip 10.20.1.0 0.0.0.63 172.16.0.0 0.15.255.255
 deny ip 10.20.1.0 0.0.0.63 192.168.0.0 0.0.255.255
 permit ip 10.20.1.0 0.0.0.63 any
 deny ip any any log
!
spanning-tree vlan 20 priority 4096
interface Vlan20
 ip address 10.20.1.1 255.255.255.192
 ip access-group VLAN-20-IN in
 ip ospf 1 area 0
 no shutdown
!
interface TenGigabitEthernet1/0/7
 description TO-HQ-Guest-AS1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 20,999
 switchport nonegotiate
 no shutdown
!
interface TenGigabitEthernet1/0/47
 description TO-HQ-R1
 no switchport
 ip address 10.20.4.17 255.255.255.252
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
interface TenGigabitEthernet1/0/48
 description TO-HQ-R2
 no switchport
 ip address 10.20.4.21 255.255.255.252
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 100
 no shutdown
!
interface range TenGigabitEthernet1/0/8 - 46
 shutdown
!
router ospf 1
 router-id 192.0.2.100
 passive-interface default
 no passive-interface TenGigabitEthernet1/0/47
 no passive-interface TenGigabitEthernet1/0/48
end
! Save after checking: copy running-config startup-config
