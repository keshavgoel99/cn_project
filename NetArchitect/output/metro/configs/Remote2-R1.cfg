! NetArchitect generated lab configuration
enable
configure terminal
hostname Remote2-R1
no ip domain-lookup
!
ip access-list extended FINANCE-SOURCES
 permit ip 10.20.0.0 0.0.0.255 any
 permit ip 10.20.2.0 0.0.0.127 any
 permit ip 10.20.3.0 0.0.0.127 any
!
class-map match-any FINANCE
 match access-group name FINANCE-SOURCES
!
policy-map MAN-QOS
 class FINANCE
  bandwidth percent 30
 class class-default
  fair-queue
!
interface GigabitEthernet1
 description TO-Remote2-DS
 ip address 10.20.4.30 255.255.255.252
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet2
 description TO-HQ-R1
 ip address 10.20.4.6 255.255.255.252
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 service-policy output MAN-QOS
 no shutdown
!
interface GigabitEthernet3
 description TO-HQ-R2
 ip address 10.20.4.14 255.255.255.252
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 100
 service-policy output MAN-QOS
 no shutdown
!
router ospf 1
 router-id 192.0.2.4
 passive-interface default
 no passive-interface GigabitEthernet1
 no passive-interface GigabitEthernet2
 no passive-interface GigabitEthernet3
end
! Save after checking: copy running-config startup-config
