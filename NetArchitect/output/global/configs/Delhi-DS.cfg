! NetArchitect generated lab configuration
enable
configure terminal
hostname Delhi-DS
no ip domain-lookup
!
ip routing
spanning-tree mode rapid-pvst
vlan 999
 name UNUSED-NATIVE
!
vlan 10
 name IoT
!
ip access-list extended VLAN-10-IN
 permit icmp 10.30.4.0 0.0.1.255 host 10.30.4.1 echo
 permit ip 10.30.4.0 0.0.1.255 10.30.16.0 0.0.0.31
 deny ip 10.30.4.0 0.0.1.255 10.0.0.0 0.255.255.255
 deny ip 10.30.4.0 0.0.1.255 172.16.0.0 0.15.255.255
 deny ip 10.30.4.0 0.0.1.255 192.168.0.0 0.0.255.255
 permit ip 10.30.4.0 0.0.1.255 any
 deny ip any any log
!
spanning-tree vlan 10 priority 4096
interface Vlan10
 ip address 10.30.4.1 255.255.254.0
 ip access-group VLAN-10-IN in
 ip ospf 1 area 0
 no shutdown
!
interface TenGigabitEthernet1/0/1
 description TO-Delhi-IoT-AS1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,999
 switchport nonegotiate
 no shutdown
!
