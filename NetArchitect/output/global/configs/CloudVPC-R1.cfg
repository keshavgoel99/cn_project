! NetArchitect generated lab configuration
enable
configure terminal
hostname CloudVPC-R1
no ip domain-lookup
!
crypto ikev2 proposal NA-PROP
 encryption aes-cbc-256
 integrity sha256
 prf sha256
 group 14
!
crypto ikev2 policy NA-POLICY
 proposal NA-PROP
!
crypto ikev2 keyring NA-KEYS
 peer Delhi-R1
  address 198.18.0.2
  pre-shared-key local fad3b30d5f309b12d15d5b246e999f9a44eb9fa47545a36a
  pre-shared-key remote fad3b30d5f309b12d15d5b246e999f9a44eb9fa47545a36a
 peer Delhi-R2
  address 198.18.0.6
  pre-shared-key local fad3b30d5f309b12d15d5b246e999f9a44eb9fa47545a36a
  pre-shared-key remote fad3b30d5f309b12d15d5b246e999f9a44eb9fa47545a36a
!
crypto ikev2 profile NA-IKE
 match identity remote any
 identity local address 198.18.0.22
 authentication remote pre-share
 authentication local pre-share
 keyring local NA-KEYS
 dpd 10 2 periodic
!
crypto ipsec transform-set NA-TRANSFORM esp-aes 256 esp-sha256-hmac
 mode transport
!
crypto ipsec profile NA-IPSEC
 set transform-set NA-TRANSFORM
 set ikev2-profile NA-IKE
!
interface GigabitEthernet1
 description TO-CloudVPC-DS
 ip address 10.30.16.70 255.255.255.252
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet2
 description MANAGED-WAN-HANDOFF
 ip address 198.18.0.22 255.255.255.252
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 198.18.0.21
!
interface Tunnel4
 description TO-Delhi-R1
 ip address 10.30.16.38 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 tunnel source GigabitEthernet2
 tunnel destination 198.18.0.2
 tunnel mode gre ip
 tunnel protection ipsec profile NA-IPSEC
 no shutdown
!
interface Tunnel8
 description TO-Delhi-R2
 ip address 10.30.16.54 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 tunnel source GigabitEthernet2
 tunnel destination 198.18.0.6
 tunnel mode gre ip
 tunnel protection ipsec profile NA-IPSEC
 no shutdown
!
router ospf 1
 router-id 192.0.2.6
 passive-interface default
 no passive-interface GigabitEthernet1
 redistribute bgp 65104 subnets route-map REMOTE-TO-OSPF
!
ip prefix-list LOCAL-LANS permit 10.30.16.0/27
ip prefix-list ALL-SITES permit 10.30.4.0/22
ip prefix-list REMOTE-SITES permit 10.30.4.0/22
ip prefix-list ALL-SITES permit 10.30.12.0/22
ip prefix-list REMOTE-SITES permit 10.30.12.0/22
ip prefix-list ALL-SITES permit 10.30.0.0/22
ip prefix-list REMOTE-SITES permit 10.30.0.0/22
ip prefix-list ALL-SITES permit 10.30.8.0/22
ip prefix-list REMOTE-SITES permit 10.30.8.0/22
ip prefix-list ALL-SITES permit 10.30.16.0/27
!
route-map LOCAL-TO-BGP permit 10
 match ip address prefix-list LOCAL-LANS
!
route-map REMOTE-TO-OSPF permit 10
 match ip address prefix-list REMOTE-SITES
!
route-map PRIMARY permit 10
 set local-preference 200
!
route-map SECONDARY permit 10
 set local-preference 100
!
router bgp 65104
 bgp log-neighbor-changes
 bgp router-id 192.0.2.6
 redistribute ospf 1 match internal route-map LOCAL-TO-BGP
 aggregate-address 10.30.16.0 255.255.255.224 summary-only
 neighbor 10.30.16.37 remote-as 65100
 neighbor 10.30.16.37 timers 3 9
 neighbor 10.30.16.37 prefix-list REMOTE-SITES in
 neighbor 10.30.16.37 prefix-list ALL-SITES out
 neighbor 10.30.16.37 route-map PRIMARY in
 neighbor 10.30.16.53 remote-as 65100
 neighbor 10.30.16.53 timers 3 9
 neighbor 10.30.16.53 prefix-list REMOTE-SITES in
 neighbor 10.30.16.53 prefix-list ALL-SITES out
 neighbor 10.30.16.53 route-map SECONDARY in
end
! Save after checking: copy running-config startup-config
