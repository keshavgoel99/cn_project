! NetArchitect generated lab configuration
enable
configure terminal
hostname CloudVPC-DS
no ip domain-lookup
!
ip routing
spanning-tree mode rapid-pvst
vlan 999
 name UNUSED-NATIVE
!
vlan 10
 name Services
!
ip access-list extended VLAN-10-IN
 permit ip 10.30.16.0 0.0.0.31 any
 deny ip any any log
!
spanning-tree vlan 10 priority 4096
interface Vlan10
 ip address 10.30.16.1 255.255.255.224
 ip access-group VLAN-10-IN in
 ip ospf 1 area 0
 no shutdown
!
interface TenGigabitEthernet1/0/1
 description TO-CloudVPC-Services-AS1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,999
 switchport nonegotiate
 no shutdown
!
interface TenGigabitEthernet1/0/47
 description TO-CloudVPC-R1
 no switchport
 ip address 10.30.16.69 255.255.255.252
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
interface range TenGigabitEthernet1/0/2 - 46
 shutdown
!
interface TenGigabitEthernet1/0/48
 shutdown
!
router ospf 1
 router-id 192.0.2.104
 passive-interface default
 no passive-interface TenGigabitEthernet1/0/47
end
! Save after checking: copy running-config startup-config
