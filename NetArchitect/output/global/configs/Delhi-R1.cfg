! NetArchitect generated lab configuration
enable
configure terminal
hostname Delhi-R1
no ip domain-lookup
!
crypto ikev2 proposal NA-PROP
 encryption aes-cbc-256
 integrity sha256
 prf sha256
 group 14
!
crypto ikev2 policy NA-POLICY
 proposal NA-PROP
!
crypto ikev2 keyring NA-KEYS
 peer Mumbai-R1
  address 198.18.0.10
  pre-shared-key local fad3b30d5f309b12d15d5b246e999f9a44eb9fa47545a36a
  pre-shared-key remote fad3b30d5f309b12d15d5b246e999f9a44eb9fa47545a36a
 peer Chennai-R1
  address 198.18.0.14
  pre-shared-key local fad3b30d5f309b12d15d5b246e999f9a44eb9fa47545a36a
  pre-shared-key remote fad3b30d5f309b12d15d5b246e999f9a44eb9fa47545a36a
 peer Kolkata-R1
  address 198.18.0.18
  pre-shared-key local fad3b30d5f309b12d15d5b246e999f9a44eb9fa47545a36a
  pre-shared-key remote fad3b30d5f309b12d15d5b246e999f9a44eb9fa47545a36a
 peer CloudVPC-R1
  address 198.18.0.22
  pre-shared-key local fad3b30d5f309b12d15d5b246e999f9a44eb9fa47545a36a
  pre-shared-key remote fad3b30d5f309b12d15d5b246e999f9a44eb9fa47545a36a
!
crypto ikev2 profile NA-IKE
 match identity remote any
 identity local address 198.18.0.2
 authentication remote pre-share
 authentication local pre-share
 keyring local NA-KEYS
 dpd 10 2 periodic
!
crypto ipsec transform-set NA-TRANSFORM esp-aes 256 esp-sha256-hmac
 mode transport
!
crypto ipsec profile NA-IPSEC
 set transform-set NA-TRANSFORM
 set ikev2-profile NA-IKE
!
interface GigabitEthernet1
 description TO-Delhi-DS
 ip address 10.30.16.74 255.255.255.252
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet2
 description MANAGED-WAN-HANDOFF
 ip address 198.18.0.2 255.255.255.252
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 198.18.0.1
!
interface Tunnel1
 description TO-Mumbai-R1
 ip address 10.30.16.45 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 tunnel source GigabitEthernet2
 tunnel destination 198.18.0.10
 tunnel mode gre ip
 tunnel protection ipsec profile NA-IPSEC
 no shutdown
!
interface Tunnel2
 description TO-Chennai-R1
 ip address 10.30.16.33 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 tunnel source GigabitEthernet2
 tunnel destination 198.18.0.14
 tunnel mode gre ip
 tunnel protection ipsec profile NA-IPSEC
 no shutdown
