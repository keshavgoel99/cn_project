<line x1='825.0' y1='467' x2='825.0' y2='505' class=''/>
<rect x='435.0' y='68' width='230' height='42' rx='5' class='box'/>
<text x='550' y='94.0' text-anchor='middle' class=''>Admin-DS</text>
<text x='550' y='56' text-anchor='middle' class='small'>10 access switches at hub</text>
<rect x='450.0' y='160' width='200' height='42' rx='5' class='edge'/>
<text x='550' y='186.0' text-anchor='middle' class=''>Admin-R1</text>
<text x='900' y='35' text-anchor='middle' class=''>OSPF Area 0 routed backbone</text>
<rect x='175.0' y='345' width='200' height='42' rx='5' class='edge'/>
<text x='275.0' y='371.0' text-anchor='middle' class=''>Teaching-R1</text>
<rect x='175.0' y='425' width='200' height='42' rx='5' class='box'/>
<text x='275.0' y='451.0' text-anchor='middle' class=''>Teaching-DS</text>
