<text x='825.0' y='531.0' text-anchor='middle' class=''>13 access switches</text>
<text x='825.0' y='570' text-anchor='middle' class='small'>10.10.12.0/22</text>
<text x='550' y='595' text-anchor='middle' class='small'>Logical sketch. Local VLANs terminate on each DS; dashed lines are backup hub paths.</text></svg>
