! NetArchitect generated lab configuration
enable
configure terminal
hostname Admin-WiFi-AS2
no ip domain-lookup
!
spanning-tree mode rapid-pvst
vlan 20
 name WiFi
vlan 999
 name UNUSED-NATIVE
!
interface range GigabitEthernet1/0/1 - 48
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
! Select a PoE+ model. Verify AP wattage against switch budget.
interface TenGigabitEthernet1/1/1
 description TO-Admin-DS
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 20,999
 switchport nonegotiate
 no shutdown
!
end
! Save after checking: copy running-config startup-config
