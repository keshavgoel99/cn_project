! NetArchitect generated lab configuration
enable
configure terminal
hostname Teaching-R1
no ip domain-lookup
!
interface GigabitEthernet1
 description TO-Teaching-DS
 ip address 10.10.16.18 255.255.255.252
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet2
 description TO-Admin-R1
 ip address 10.10.16.6 255.255.255.252
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
router ospf 1
 router-id 192.0.2.2
 passive-interface default
 no passive-interface GigabitEthernet1
 no passive-interface GigabitEthernet2
end
! Save after checking: copy running-config startup-config
