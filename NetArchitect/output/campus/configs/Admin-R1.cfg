! NetArchitect generated lab configuration
enable
configure terminal
hostname Admin-R1
no ip domain-lookup
!
interface GigabitEthernet1
 description TO-Admin-DS
 ip address 10.10.16.10 255.255.255.252
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet2
 description TO-Teaching-R1
 ip address 10.10.16.5 255.255.255.252
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet3
 description TO-Library-R1
 ip address 10.10.16.1 255.255.255.252
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
router ospf 1
 router-id 192.0.2.1
 passive-interface default
 no passive-interface GigabitEthernet1
 no passive-interface GigabitEthernet2
 no passive-interface GigabitEthernet3
end
! Save after checking: copy running-config startup-config
